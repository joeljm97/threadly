# Builds the Threadly APK in the cloud on every push (and on demand).
# Download it from the run's "Artifacts" section.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.threadly --project-name threadly --platforms=android,ios .
          fi

      - run: flutter pub get
      - name: Analyze (errors shown as annotations)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || true
          grep -E "^\s*error" analyze.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            grep -E "Error|error:" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/threadly.apk
      - name: Build smaller per-phone APKs
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/threadly-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: threadly-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Publishes the APK as a GitHub Release so it can be downloaded straight to a phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Threadly build ${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/threadly.apk
            build/app/outputs/flutter-apk/threadly-arm64.apk
          make_latest: true
