# Builds the Threadly APK in the cloud on every push (and on demand).
# Download it from the run's "Artifacts" section.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.threadly --project-name threadly --platforms=android,ios .
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/threadly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: threadly-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Publishes the APK as a GitHub Release so it can be downloaded straight to a phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Threadly build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/threadly.apk
          make_latest: true
